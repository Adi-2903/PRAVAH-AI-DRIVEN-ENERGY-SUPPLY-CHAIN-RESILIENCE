name: CI

on:
  push:
    branches: [main, Preetansh, vraj]
  pull_request:

jobs:
  backend:
    name: Backend — pytest contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run contract tests
        run: pytest test_api.py -v

  integration:
    name: Integration — frontend↔backend contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend deps
        run: pip install -r requirements.txt
      - name: Start backend
        run: |
          uvicorn api:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break || sleep 1; done
      - name: Run frontend↔backend contract test
        run: node verify_frontend_contract.mjs

  frontend:
    name: Frontend — build (lint + types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci        # frontend/.npmrc sets legacy-peer-deps=true
      - name: Build (runs eslint + tsc)
        run: npm run build
